[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cortexos"
version = "2.0.0"
description = "通用记忆服务（Memory-as-a-Service）——任意 Agent 可接入的读写统一记忆"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Agent-CortexOS Contributors"}
]
keywords = ["ai", "agent", "memory", "cognitive", "llm", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.9",
    "aiosqlite>=0.19",
    "ulid-py>=1.1",
    "fastapi>=0.109",
    "uvicorn>=0.25",
    "httpx>=0.26",
    "numpy>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "httpx>=0.26",
    "ruff>=0.1.0",
]

[project.scripts]
cortexos = "cortexos.cli.main:app"

[project.urls]
Homepage = "https://github.com/hubmover007/agent-cortexos"
Documentation = "https://github.com/hubmover007/agent-cortexos#readme"
Repository = "https://github.com/hubmover007/agent-cortexos"

[tool.setuptools.packages.find]
include = ["cortexos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
