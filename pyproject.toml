[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cortexos"
version = "0.1.0"
description = "Cognitive Operating System for AI Agents — structured memory, cross-session state, and proactive task management."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Agent-CortexOS Contributors"}
]
keywords = ["ai", "agent", "memory", "cognitive", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
cortexos = "cortexos.cli.main:main"

[project.urls]
Homepage = "https://github.com/anthropic/agent-cortexos"
Documentation = "https://github.com/anthropic/agent-cortexos#readme"
Repository = "https://github.com/anthropic/agent-cortexos"
Issues = "https://github.com/anthropic/agent-cortexos/issues"

[tool.setuptools.packages.find]
include = ["cortexos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100
